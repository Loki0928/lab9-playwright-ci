<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Расчёт доставки</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 560px; margin: 40px auto; padding: 24px; }
    label { display:block; margin: 14px 0 6px; }
    input, select, button { padding: 10px; width: 100%; box-sizing: border-box; }
    button { margin-top: 18px; cursor: pointer; }
    #result { margin-top: 20px; padding: 14px; background: #eef5ff; }
  </style>
</head>
<body>
  <h1>Расчёт стоимости доставки</h1>
  <label for="area">Тип доставки</label>
  <select id="area">
    <option value="city">По городу</option>
    <option value="region">По области</option>
  </select>
  <label for="amount">Сумма заказа (₸)</label>
  <input id="amount" type="number" min="0" step="1" value="5000">
  <button id="calculate" type="button">Рассчитать</button>
  <div id="result" role="status" aria-live="polite">Введите сумму и нажмите «Рассчитать».</div>
  <script>
    function calculateDelivery(area, amount) {
      if (!Number.isFinite(amount) || amount < 0) {
        return { valid: false, message: "Введите корректную сумму заказа." };
      }
      if (amount >= 10000) {
        return { valid: true, price: 0, message: "Доставка бесплатная." };
      }
      const price = area === "region" ? 2000 : 1000;
      return { valid: true, price, message: `Стоимость доставки: ${price} ₸.` };
    }
    document.getElementById("calculate").addEventListener("click", () => {
      const area = document.getElementById("area").value;
      const amount = Number(document.getElementById("amount").value);
      const result = calculateDelivery(area, amount);
      const output = document.getElementById("result");
      output.textContent = result.message;
      output.dataset.price = result.valid ? String(result.price) : "invalid";
    });
  </script>
</body>
</html>
